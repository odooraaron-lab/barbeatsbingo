# Copies the photos from the old WordPress site into public/images.
# Run it once from GitHub → Actions → "Copy photos from the old website" → Run workflow,
# BEFORE pointing barbeatsbingo.com at Vercel.
name: Copy photos from the old website

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Address of the old WordPress site
        default: https://www.barbeatsbingo.com
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download photos
        env:
          ORIGIN: ${{ inputs.origin }}
        run: |
          set -u
          grep -oE 'img\("[^"]+"\)' src/lib/site.ts | sed -E 's/img\("([^"]+)"\)/\1/' | sort -u | while read -r path; do
            mkdir -p "public/images/$(dirname "$path")"
            if curl -fsSL --retry 2 "$ORIGIN/wp-content/uploads/$path" -o "public/images/$path"; then
              echo "copied $path"
            else
              echo "::warning::could not download $path"
              rm -f "public/images/$path"
            fi
          done

      - name: Commit the photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Copy photos from the old website"
            git push
          fi
